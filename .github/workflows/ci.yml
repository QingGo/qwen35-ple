name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen35-ple
    steps:
      - uses: actions/checkout@v4
        with:
          path: qwen35-ple

      # Cross-repo contract smoke: make sibling repos available for
      # tests/test_hash_golden.py and tests/test_cross_repo_hash_golden.py.
      - uses: actions/checkout@v4
        with:
          repository: QingGo/EngramDB
          ref: v0.2.12
          path: EngramDB
      - uses: actions/checkout@v4
        with:
          repository: QingGo/engram-peft
          ref: v1.2.7
          path: engram-peft

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            qwen35-ple/uv.lock

      - name: Install Rust (for local engramdb-python build)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check src tests scripts/mechanism_alignment.py scripts/mechanism_logit_patch.py scripts/mechanism_patching.py scripts/mechanism_incremental_r2.py scripts/mechanism_gradient_r2.py scripts/mechanism_gradient_sweep.py scripts/mechanism_advanced_sweep.py scripts/mechanism_oracle_mlp.py scripts/train_mlp_value_reader.py scripts/mechanism_mlp_dependence.py scripts/build_rare_kb.py scripts/mechanism_rare_task_r2.py scripts/analyze_rare_kb_logit.py scripts/build_exact_ple_bank.py scripts/train_p1_memory.py scripts/eval_p1_memory.py scripts/run_rag_baseline.py scripts/estimate_ple_bounds.py scripts/train_b3_logit_memory.py scripts/eval_b3_logit_memory.py scripts/run_multi_task_eval.py scripts/audit_eval_contamination.py

      - name: Test
        run: uv run pytest -q

      - name: Access-order synthetic gate
        run: uv run python scripts/bench_access_order.py --synthetic --synthetic-tokens 512 --seq-len 64 --step 64 --reps 2 --max-ratio 2.0

      - name: Lazy-window synthetic gate
        run: uv run python scripts/bench_lazy_windows.py --synthetic --synthetic-tokens 512 --seq-len 64 --step 64 --max-batch-s 0.05
