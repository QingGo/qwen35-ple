<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLE Inference Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Geist', sans-serif; background: #f5f5f5; color: #2d3142; padding: 2rem; }
  .frame { max-width: 1100px; margin: auto; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; margin-bottom: 1rem; }
  svg { width: 100%; height: auto; }
</style>
</head>
<body>
<div class="frame">
<h1>PLE inference pipeline</h1>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">PLE inference pipeline</title>
  <desc id="pipe-desc">Inference flow from query through task classification, retrieval, memory feature extraction, token policy decision, and final logit fusion.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- arrows behind nodes -->
  <line x1="480" y1="88" x2="480" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="176" x2="480" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="264" x2="480" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="352" x2="480" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="460" x2="480" y2="500" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <line x1="580" y1="410" x2="620" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="548" x2="480" y2="580" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 700,434 V 580 H 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="628" x2="480" y2="660" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <rect x="440" y="456" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="456" y="465" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">YES</text>
  <rect x="588" y="398" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="600" y="407" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

  <!-- start -->
  <rect x="400" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="480" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Query / Prompt</text>

  <!-- steps -->
  <rect x="400" y="128" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Task Classifier</text>

  <rect x="400" y="216" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BM25 + PLE Retrieval</text>

  <rect x="400" y="304" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory Feature Extraction</text>

  <!-- decision -->
  <polygon points="480,360 580,410 480,460 380,410" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="406" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Token Policy:</text>
  <text x="480" y="420" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">confident?</text>

  <!-- projects -->
  <rect x="400" y="500" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="480" y="528" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PLE Projector</text>
  <text x="480" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scale / bias</text>

  <rect x="620" y="386" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="700" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Base Logits only</text>

  <rect x="400" y="580" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Logit Fusion</text>
  <text x="480" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">safety gate</text>

  <!-- end -->
  <rect x="400" y="660" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="480" y="688" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decode / Output</text>
</svg>
</div>
</body>
</html>
