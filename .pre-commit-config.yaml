# Pre-commit hooks: catch lint issues locally before CI.
# Matches the CI lint command: `ruff check src tests`.
# Install with:
#   pip install pre-commit
#   pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
