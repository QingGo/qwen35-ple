name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen35-ple
    steps:
      - uses: actions/checkout@v4
        with:
          path: qwen35-ple

      # Cross-repo contract smoke: make sibling repos available for
      # tests/test_hash_golden.py and tests/test_cross_repo_hash_golden.py.
      - uses: actions/checkout@v4
        with:
          repository: QingGo/EngramDB
          ref: v0.2.12
          path: EngramDB
      - uses: actions/checkout@v4
        with:
          repository: QingGo/engram-peft
          ref: v1.2.7
          path: engram-peft

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            qwen35-ple/uv.lock

      - name: Install Rust (for local engramdb-python build)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

      - name: Access-order synthetic gate
        run: uv run python scripts/bench_access_order.py --synthetic --synthetic-tokens 512 --seq-len 64 --step 64 --reps 2 --max-ratio 2.0

      - name: Lazy-window synthetic gate
        run: uv run python scripts/bench_lazy_windows.py --synthetic --synthetic-tokens 512 --seq-len 64 --step 64 --max-batch-s 0.05
