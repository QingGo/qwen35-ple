name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen35-ple
    steps:
      - uses: actions/checkout@v4
        with:
          path: qwen35-ple

      # Cross-repo contract smoke: make sibling repos available for
      # tests/test_hash_golden.py and tests/test_cross_repo_hash_golden.py.
      - uses: actions/checkout@v4
        with:
          repository: QingGo/EngramDB
          path: EngramDB
      - uses: actions/checkout@v4
        with:
          repository: QingGo/engram-peft
          ref: master
          path: engram-peft

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            qwen35-ple/uv.lock

      - name: Install Rust (for local engramdb-python build)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q
